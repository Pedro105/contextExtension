# Harness plumbing check: tiny model, subprocess-launched vLLM (no Docker), short
# contexts, low request counts. Verifies the sweep driver, load generator, metrics
# scraper, and analysis path all work end to end -- not a real measurement. Requires
# vLLM installed locally (`pip install -e .[serve]`); since vLLM depends on
# transformers itself, allow_fake_tokenizer is deliberately left at its default
# (false) -- a real tokenizer is expected to be available whenever this can run at
# all.
server:
  mode: subprocess
  host_port: 8000
  startup_timeout_s: 300 # tiny model, but cold-start (weights download, CUDA init) can still take a while

models:
  - hf_model_id: hf-internal-testing/tiny-random-gpt2

context_lengths: [64, 128]
concurrency_levels: [1, 2]

workload:
  n_requests_per_cell: 4
  max_output_tokens: 8
  prefix_tokens: 8
  enable_shared_prefix: false
  warmup_requests: 1
  seed: 0

metrics_poll_interval_s: 0.5
max_num_seqs: 4
gpu_memory_utilization: 0.9
enable_prefix_caching: false
